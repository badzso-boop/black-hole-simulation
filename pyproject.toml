[build-system]
requires      = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name             = "black-hole-simulator"
version          = "3.2.0"
requires-python  = ">=3.11"
description      = "Norbi-hipotézis: Fekete Lyuk — Belső Univerzum Szimulátor"
authors          = [{ name = "Norbi & Claude" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "hypothesis>=6.0",
]
# a tézis-számolásokhoz (docs/thesis-plan.md): pip install -e '.[dev,thesis]'
thesis = [
    "camb>=2.0",
    "getdist>=1.7",
    "matplotlib>=3.8",
    "cobaya>=3.5",
]

[tool.maturin]
module-name   = "black_hole_core"
features      = ["python-ext"]
manifest-path = "core/Cargo.toml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit szabálykészlet, hogy a helyi és a CI-beli (újabb) ruff ugyanazt ellenőrizze
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # sorhossz; magyar/matematikai Unicode a szövegekben

[tool.mypy]
# python_version szándékosan nincs rögzítve: a futtató interpreter verzióját
# használja, így a CI-mátrix minden eleme a hozzá telepített numpy-stubokkal megy
strict         = true

[[tool.mypy.overrides]]
module = ["black_hole_core", "camb", "camb.*", "scipy", "scipy.*", "cobaya", "cobaya.*", "getdist", "getdist.*"]
ignore_missing_imports = true
