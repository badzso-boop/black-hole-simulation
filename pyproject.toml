[build-system]
requires      = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name             = "black-hole-simulator"
version          = "2.0.0"
requires-python  = ">=3.11"
description      = "Norbi-hipotézis: Fekete Lyuk — Belső Univerzum Szimulátor"
authors          = [{ name = "Norbi & Claude" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "qiskit>=1.0",
    "scikit-learn>=1.4",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "hypothesis>=6.0",
]

[tool.maturin]
module-name   = "black_hole_core"
features      = ["python-ext"]
manifest-path = "core/Cargo.toml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict         = true
