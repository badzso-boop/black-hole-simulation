name: Integration Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Python telepites
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Virtualenv letrehozasa
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Teljes projekt build
        run: pip install -e '.[dev]'

      - name: Standard szimulacio (Planck-tomeg)
        run: python -m python.main --mass 2.176e-8 --norbi-mode false --no-ui --output output/ci_standard.json

      - name: Norbi szimulacio
        run: python -m python.main --mass 2.176e-8 --norbi-mode true --no-ui --output output/ci_norbi.json

      - name: Eredmeny validacio
        run: python scripts/validate_results.py output/ci_standard.json output/ci_norbi.json

      - name: Artifact mentes
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: output/
          retention-days: 30
