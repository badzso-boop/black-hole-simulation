name: Integration Tests

on:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Python telepites
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Virtualenv letrehozasa
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Teljes projekt build
        run: pip install -e '.[dev]'

      - name: Tomeg-scan szimulaciok (Standard + Norbi)
        run: |
          # 2 m_P (a tomegres kozeleben), 1 kg, 5.1e11 kg (ma parolgo PBH), Nap
          for m in 4.35e-8 1 5.1e11 1.98847e30; do
            for n in false true; do
              python -m python --mass "$m" --norbi-mode "$n" --output "output/ci_${m}_${n}.json"
            done
          done

      - name: Tomegres alatt hibaval kell leallnia
        run: |
          if python -m python --mass 1e-8 --output output/ci_gap.json; then
            echo "A tomegres alatti tomegnek hibat kellett volna adnia"; exit 1
          fi

      - name: Eredmeny validacio
        run: python scripts/validate_results.py output/ci_*_*.json

      - name: Artifact mentes
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: output/
          retention-days: 30
