name: Python Analysis Tests

on:
  push:
    branches: [main, develop]
    paths: ['python/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Python telepítés
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust toolchain (PyO3-hoz)
        uses: dtolnay/rust-toolchain@stable

      - name: Függoségek telepítése
        run: |
          pip install maturin
          maturin develop --manifest-path core/Cargo.toml --features python-ext
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check python/

      - name: Mypy
        run: mypy python/

      - name: Pytest
        run: pytest python/tests/ -v --cov=python --cov-report=xml

      - name: Codecov
        uses: codecov/codecov-action@v3
