name: Python Analysis Tests

on:
  push:
    branches: [main, develop]
    paths: ['python/**', 'core/**', 'pyproject.toml']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Python telepítés
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust toolchain (PyO3-hoz)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Virtualenv létrehozása
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Fuggosegek telepitese (Rust build + Python)
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check python/

      - name: Mypy
        run: mypy python/

      - name: Pytest
        run: pytest python/tests/ -v --cov=python --cov-report=xml

      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
