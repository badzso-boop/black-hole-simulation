[package]
name    = "black-hole-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
black-hole-core = { path = "../../core" }
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
tauri           = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
